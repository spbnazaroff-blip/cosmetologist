name: Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmetologist-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_HOST: cosmetologist-dev.denisnazarov.online
      TEST_USER: u3249400
      TEST_ROOT: /var/www/u3249400/data/www/cosmetologist-dev.denisnazarov.online
      TEST_URL: https://cosmetologist-dev.denisnazarov.online/

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: PHP syntax check
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Configure SSH
        env:
          TEST_SSH_KEY_B64: ${{ secrets.TEST_SSH_KEY_B64 }}
        run: |
          test -n "$TEST_SSH_KEY_B64" || { echo 'Missing repository secret TEST_SSH_KEY_B64'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || { echo 'TEST_SSH_KEY_B64 does not decode to a valid OpenSSH private key'; exit 1; }
          ssh-keyscan -H "$TEST_HOST" >> ~/.ssh/known_hosts

      - name: Preflight target
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$TEST_USER@$TEST_HOST" \
            "test -d '$TEST_ROOT' && test -w '$TEST_ROOT'"

      - name: Backup current TEST
        run: |
          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$TEST_USER@$TEST_HOST" \
            "mkdir -p \"\$HOME/deploy-backups/cosmetologist-dev\"; if find '$TEST_ROOT' -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null | grep -q .; then tar -C '$TEST_ROOT' -czf \"\$HOME/deploy-backups/cosmetologist-dev/before_${STAMP}.tar.gz\" .; fi"

      - name: Deploy dev to TEST
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.well-known/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519" \
            ./ "$TEST_USER@$TEST_HOST:$TEST_ROOT/"

      - name: HTTP health check
        run: |
          for attempt in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/test-page.html -w '%{http_code}' --max-time 15 "$TEST_URL" || true)"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              grep -qi '<html' /tmp/test-page.html
              exit 0
            fi
            sleep 3
          done
          exit 1
